name: Уведомления
on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [test, morning, evening]
        default: test
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save web-push@3
      - run: mkdir -p scripts && cp send.js scripts/ && node scripts/send.js
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
          MODE: ${{ inputs.mode || 'auto' }}
